name: release

# A pushed v<major>.<minor>.<patch> tag becomes an arm64 image on GHCR and then a draft GitHub Release whose
# image-digest.txt names that image by digest and whose notes summarize the PRs since the release the beta's GET /health
# reports, or since the highest published release when it reports none. The tag must be on master and equal the version
# in package.json at the tagged commit. A tag push runs this file and the check as the tag has them, so the tag ruleset
# (infra/github/tag-ruleset.json) decides who can cut a release. GHCR tags are mutable, so every deploy uses the digest in
# the release, never a tag. The release is written last, so it never names an image that was not pushed and checked.
# Publishing the draft is the deploy approval: the beta server's afterclass-autodeploy deploys the highest published
# release. The image holds no keys, since the server reads them from Parameter Store at start.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - id: check
        name: The tag is on master and equals the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(bun scripts/check-release-tag.ts "$TAG")
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      # PR titles reach the output, so a random delimiter keeps a title from ending it early.
      - id: notes
        name: Summarize the PRs since the release the beta runs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          set -euo pipefail
          notes=$(bun scripts/release-notes.ts "$TAG" "$COMMIT")
          delimiter=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          printf 'notes<<%s\n%s\n%s\n' "$delimiter" "$notes" "$delimiter" >> "$GITHUB_OUTPUT"

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.commit }}
      # The Dockerfile builds its dependency stages on the runner's own platform and its last stage runs nothing, so an
      # x86 runner builds the arm64 image without emulation. Every run builds and pushes, so a stale or planted image under
      # the commit tag is replaced, never promoted. The digest comes from this push's own output.
      - id: push
        name: Push the arm64 image to GHCR and tag it by commit and by release
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          set -euo pipefail
          image=ghcr.io/derekhertz/after-class
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker build --platform linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${image}:${COMMIT}" .
          pushed=$(docker push "${image}:${COMMIT}")
          printf '%s\n' "$pushed"
          digest=$(printf '%s\n' "$pushed" | sed -n -E "s/^${COMMIT}: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p")
          docker buildx imagetools create --prefer-index=false --tag "${image}:${TAG}" "${image}@${digest}"
          for ref in "${image}:${COMMIT}" "${image}:${TAG}"; do
            now=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")
            if [ "$now" != "$digest" ]; then
              echo "${ref} is ${now}, not the ${digest} this run pushed" >&2
              exit 1
            fi
          done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  release:
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A rerun replaces only image-digest.txt on a draft, so notes edited in the draft stay. A published release is refused,
      # because publishing approved the image it names. A rebuilt image needs a new version.
      - name: Record the image digest in a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.check.outputs.commit }}
          DIGEST: ${{ needs.image.outputs.digest }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the image job passed no digest" >&2
            exit 1
          fi
          record="${RUNNER_TEMP}/image-digest.txt"
          printf 'commit %s\ndigest %s\n' "$COMMIT" "$DIGEST" > "$record"
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || draft=none
          case "$draft" in
            true)
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$record"
              ;;
            none)
              notes="${RUNNER_TEMP}/notes.md"
              printf '%s\n' "$NOTES" > "$notes"
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file "$notes" "$record"
              ;;
            *)
              echo "${TAG} is published, so its image-digest.txt stays as approved. Cut a new version to release a rebuilt image." >&2
              exit 1
              ;;
          esac
