name: claude

# Comment "@claude <what to do>" on an issue or PR, or add the "claude" label to an issue.
# Claude works on a new branch (or the PR's branch), runs the checks, pushes, and replies with a link to open the PR.
# Only Derek can trigger it: this repo is public, so anyone else's comment must not spend the subscription.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claude:
    if: |
      github.actor == 'DerekHertz' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Installed here from the lockfile, so Claude never needs (or gets) a package-install command.
      - run: bun install --frozen-lockfile
      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: DerekHertz
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(bun run typecheck),Bash(bun test:*),Bash(bun run build:app),Bash(bun run build:ext),Bash(bun scripts/preview-ui.ts --build-only),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
            --append-system-prompt "Follow CLAUDE.md. Review issues name a baseline commit: recheck each claim against the current branch first, and if it no longer holds, say so instead of changing code. Do not add, remove or upgrade dependencies; if a fix needs one, stop and propose it (name, exact version, why). Never make live provider calls; tests use fake or replay providers. Before pushing, bun run typecheck and bun test must both pass; report their results in your reply. Keep each change to the issue it was asked for. Write commit messages, the PR title and body in the Create PR link, and your reply by docs/pr-writing.md."
